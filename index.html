<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Economy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7ECE1; --paper-grid: rgba(30,42,34,0.06);
    --card:#F3F1E6; --card-border: rgba(30,42,34,0.14);
    --ink:#1E2A22; --ink-soft:#5B6B5F; --ink-faint:#8B978E;
    --rule: rgba(30,42,34,0.20);
    --met:#3F6B4A; --met-tint: rgba(63,107,74,0.12);
    --notmet:#B5502F; --notmet-tint: rgba(181,80,47,0.10);
    --blue:#2F5A9E;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --radius: 3px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: linear-gradient(var(--paper-grid) 1px, transparent 1px), linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink); font-family: var(--font-body); line-height:1.5;
    -webkit-font-smoothing: antialiased; min-height:100vh;
  }
  #app{ max-width: 760px; margin:0 auto; padding: 28px 16px 80px; }
  .masthead{ padding: 4px 4px 22px; border-bottom: 2px solid var(--ink); margin-bottom: 24px; }
  .eyebrow{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.14em; color: var(--ink-soft); text-transform: uppercase; margin-bottom:6px; }
  h1{ font-family: var(--font-display); font-weight:600; font-size:34px; margin:0 0 6px; letter-spacing:-0.01em; }
  h2{ font-family: var(--font-display); font-weight:600; font-size:19px; margin:0 0 12px; }
  h3{ font-family: var(--font-display); font-weight:600; font-size:16px; margin:0; }
  .sub{ font-size:14px; color: var(--ink-soft); margin:0; }
  nav.links{ margin-top:10px; font-family: var(--font-mono); font-size:11px; letter-spacing:0.04em; }
  nav.links a{ color: var(--ink-soft); text-decoration: underline; }
  .card{ background: var(--card); border:1px solid var(--card-border); border-radius: var(--radius); padding:20px; margin-bottom:20px; }
  .stat-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom: 14px; }
  .stat{ flex:1 1 140px; border:1px solid var(--rule); border-radius: var(--radius); background:#fff; padding:12px 14px; }
  .stat .k{ font-family: var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color: var(--ink-soft); }
  .stat .v{ font-family: var(--font-display); font-size:28px; font-weight:600; line-height:1.2; }
  .stat .v.met{ color: var(--met); }
  .week-row{ display:grid; grid-template-columns: 1fr 120px 74px 46px; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--rule); }
  .week-row:last-child{ border-bottom:none; }
  .week-row .name{ font-weight:600; font-size:14px; }
  .week-row .def{ font-family: var(--font-mono); font-size:11px; color: var(--ink-soft); display:block; font-weight:400; }
  .bar{ height:10px; background: rgba(30,42,34,0.08); border-radius:2px; overflow:hidden; }
  .bar > span{ display:block; height:100%; background: var(--met); }
  .bar.over > span{ background: var(--notmet); }
  .num{ font-family: var(--font-mono); font-size:12.5px; text-align:right; }
  .earned{ font-family: var(--font-mono); font-size:12.5px; text-align:right; color: var(--met); font-weight:600; }
  .tag{ font-family: var(--font-mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; padding:2px 6px; border-radius:2px; }
  .tag.met{ background: var(--met-tint); color: var(--met); }
  .tag.notmet{ background: var(--notmet-tint); color: var(--notmet); }
  .goal-block{ margin-bottom: 26px; }
  .goal-block:last-child{ margin-bottom:0; }
  .goal-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .goal-def{ font-family: var(--font-mono); font-size:11.5px; color: var(--ink-soft); }
  .graph-scroll{ overflow-x:auto; border:1px solid var(--rule); border-radius: var(--radius); background:#fff; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; font-family: var(--font-mono); font-size:11px; color: var(--ink-soft); margin: 0 0 18px; }
  .legend i{ display:inline-block; width:18px; height:0; border-top:2px solid; vertical-align:middle; margin-right:6px; }
  .empty-note{ font-size:13.5px; color: var(--ink-soft); padding:8px 0; }
  .status-msg{ font-family: var(--font-mono); font-size:12.5px; color: var(--ink-soft); padding:30px 4px; text-align:center; }
  .btn{ font-family: var(--font-body); font-weight:600; font-size:13px; border-radius: var(--radius); border:1px solid var(--ink); background: var(--ink); color: var(--card); padding:8px 14px; cursor:pointer; }
  .tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .tabs button{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.05em; padding:6px 10px; border:1px solid var(--ink); background:#fff; color: var(--ink-soft); border-radius: var(--radius); cursor:pointer; }
  .tabs button.on{ background: var(--ink); color: var(--card); }
  @media (max-width:520px){
    h1{ font-size:27px; } .card{ padding:16px; }
    .week-row{ grid-template-columns: 1fr 70px 64px 40px; }
  }
</style>
</head>
<body>
<div id="app"><div class="status-msg">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://pqxhnvniansvfkuemblr.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_eroTj4udNADA-dI-kHa94Q_vcZvj2HV';
  var DOLLARS_PER_DAY = 1;
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var app = document.getElementById('app');
  var session = null, data = null, view = 'earning', loginError = null;

  // ---------- dates (week = Monday to Sunday) ----------
  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(s, n){ var d = parse(s); d.setDate(d.getDate()+n); return iso(d); }
  function weekStart(s){ var d = parse(s); var dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return iso(d); }
  function monthStart(s){ return s.slice(0,7)+'-01'; }
  function today(){ return iso(new Date()); }
  function short(s){ return parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
  function fmt(n){ if(n === null || n === undefined || isNaN(n)) return '–'; return Math.round(n) === n ? String(n) : String(Math.round(n*10)/10); }
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  // ---------- load ----------
  async function load(){
    var r = await Promise.all([
      sb.from('te_goals').select('*').order('sort_order'),
      sb.from('te_objectives').select('*').order('start_date'),
      sb.from('te_entries').select('*').order('entry_date'),
      sb.from('te_payouts').select('*').order('week_start')
    ]);
    for(var i=0;i<r.length;i++){ if(r[i].error) throw r[i].error; }
    return { goals: r[0].data, objectives: r[1].data, entries: r[2].data, payouts: r[3].data };
  }

  // one value per goal per day: the largest across sources (so a walk logged twice counts once)
  function dailyValues(goalId){
    var m = {};
    data.entries.forEach(function(e){
      if(e.goal_id !== goalId) return;
      var v = Number(e.value);
      if(!(e.entry_date in m) || v > m[e.entry_date]) m[e.entry_date] = v;
    });
    return m;
  }
  function objectivesFor(goalId){ return data.objectives.filter(function(o){ return o.goal_id === goalId; }); }
  function objectiveOn(goalId, dateISO){
    var cur = null;
    objectivesFor(goalId).forEach(function(o){ if(o.start_date <= dateISO) cur = o; });
    if(!cur){ var all = objectivesFor(goalId); cur = all.length ? all[0] : null; }
    return cur ? Number(cur.value) : null;
  }
  function earnsOn(g, v){
    if(g.role !== 'earning' || g.daily_threshold === null) return false;
    var t = Number(g.daily_threshold);
    return g.direction === 'at_least' ? v >= t : v <= t;
  }
  function periodKey(g, d){ return g.time_window === 'month' ? monthStart(d) : weekStart(d); }
  function aggregate(g, vals){
    if(!vals.length) return null;
    if(g.aggregate === 'avg') return vals.reduce(function(a,b){return a+b;},0)/vals.length;
    if(g.aggregate === 'last') return vals[vals.length-1];
    return vals.reduce(function(a,b){return a+b;},0);
  }
  function periodSeries(g){
    var dv = dailyValues(g.id), byP = {};
    Object.keys(dv).sort().forEach(function(d){ var k = periodKey(g, d); (byP[k] = byP[k] || []).push(dv[d]); });
    var keys = Object.keys(byP).sort();
    // fill gaps so missing weeks show as gaps on the x axis
    var filled = [];
    if(keys.length){
      var cur = keys[0], last = periodKey(g, today());
      if(last < keys[keys.length-1]) last = keys[keys.length-1];
      var guard = 0;
      while(cur <= last && guard++ < 400){
        filled.push({ key: cur, value: byP[cur] ? aggregate(g, byP[cur]) : null, partial: cur === periodKey(g, today()) });
        cur = g.time_window === 'month' ? (function(){ var d = parse(cur); d.setMonth(d.getMonth()+1); return iso(d); })() : addDays(cur, 7);
      }
    }
    return filled;
  }
  function metPeriod(g, val, obj){
    if(val === null || obj === null) return null;
    return g.direction === 'at_least' ? val >= obj : val <= obj;
  }

  // ---------- this week ----------
  function thisWeek(){
    var ws = weekStart(today()), we = addDays(ws, 6);
    var rows = [], dollars = 0;
    data.goals.forEach(function(g){
      if(g.status !== 'active') return;
      var dv = dailyValues(g.id), vals = [], days = 0;
      Object.keys(dv).forEach(function(d){
        if(d >= ws && d <= we){ vals.push(dv[d]); if(earnsOn(g, dv[d])) days++; }
      });
      dollars += days * DOLLARS_PER_DAY;
      rows.push({ g: g, total: aggregate(g, vals), obj: objectiveOn(g.id, today()), days: days, logged: vals.length });
    });
    return { ws: ws, we: we, rows: rows, dollars: dollars };
  }
  function allTimeDollars(){
    var total = 0;
    data.goals.forEach(function(g){
      var dv = dailyValues(g.id);
      Object.keys(dv).forEach(function(d){ if(earnsOn(g, dv[d])) total += DOLLARS_PER_DAY; });
    });
    return total;
  }

  // ---------- render ----------
  function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }

  function render(){
    app.innerHTML = '';
    var head = el('div','masthead',
      '<div class="eyebrow">Self-management · token economy</div>' +
      '<h1>Token Economy</h1>' +
      '<p class="sub">What the evening check-in has logged, how each week stacks up against its objective, and what has been earned for the bucket.</p>' +
      '<nav class="links"><a href="#week">THIS WEEK</a> &middot; <a href="#sunday">SUNDAY</a> &middot; <a href="#graphs">GRAPHS</a></nav>');
    app.appendChild(head);

    if(!session){
      var c = el('div','card','<h2>Sign in</h2>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">' +
        '<input id="liEmail" type="email" autocomplete="email" placeholder="Email" style="flex:1 1 220px;font:14px var(--font-body);padding:8px 9px;border:1px solid var(--rule);border-radius:3px;">' +
        '<input id="liPass" type="password" autocomplete="current-password" placeholder="Password" style="flex:1 1 180px;font:14px var(--font-body);padding:8px 9px;border:1px solid var(--rule);border-radius:3px;">' +
        '</div>');
      var b = el('button','btn','Log in');
      b.onclick = async function(){
        b.disabled = true;
        var r = await sb.auth.signInWithPassword({ email: document.getElementById('liEmail').value.trim(), password: document.getElementById('liPass').value });
        if(r.error){ loginError = r.error.message; b.disabled = false; render(); return; }
        session = r.data.session; loginError = null; render();
        try{ data = await load(); }catch(e){ loginError = e.message; }
        render();
      };
      c.appendChild(b);
      if(loginError){ var er = el('div','empty-note', esc(loginError)); er.style.color = 'var(--notmet)'; c.appendChild(er); }
      app.appendChild(c); return;
    }
    if(!data){ app.appendChild(el('div','status-msg','Loading your data…')); return; }

    app.appendChild(renderWeek());
    app.appendChild(renderSunday());
    app.appendChild(renderGraphs());
    var foot = el('div', null); foot.style.textAlign = 'center'; foot.style.marginTop = '24px';
    var out = el('button', null, 'Log out');
    out.style.cssText = 'font:11px var(--font-mono);color:var(--ink-faint);background:none;border:none;text-decoration:underline;cursor:pointer;';
    out.onclick = async function(){ await sb.auth.signOut(); session = null; data = null; render(); };
    foot.appendChild(out); app.appendChild(foot);
  }

  // ---------- Sunday check-in: steps to approve + payouts ----------
  var PROGRAM_START = '2026-11-09';
  var busy = false, flash = null;

  function isSunday(){ return new Date().getDay() === 0; }
  function reviewWeek(){ var ws = weekStart(today()); return isSunday() ? ws : addDays(ws, -7); }
  function weekTotal(g, ws){
    var dv = dailyValues(g.id), vals = [];
    Object.keys(dv).forEach(function(d){ if(d >= ws && d <= addDays(ws, 6)) vals.push(dv[d]); });
    return aggregate(g, vals);
  }
  function weekEarnings(ws){
    var days = 0, we = addDays(ws, 6);
    data.goals.forEach(function(g){
      var dv = dailyValues(g.id);
      Object.keys(dv).forEach(function(d){ if(d >= ws && d <= we && d >= PROGRAM_START && earnsOn(g, dv[d])) days++; });
    });
    return { days: days, dollars: days * DOLLARS_PER_DAY };
  }
  function currentObjectiveRow(g){
    var cur = null;
    objectivesFor(g.id).forEach(function(o){ if(o.start_date <= today()) cur = o; });
    return cur;
  }
  function scheduledObjective(g){
    return objectivesFor(g.id).filter(function(o){ return o.start_date > today(); }).pop() || null;
  }
  function nextStep(g, obj){
    if(g.step_size === null || obj === null) return null;
    var s = Number(g.step_size), annual = g.annual_target !== null ? Number(g.annual_target) : null, v;
    if(g.step_type === 'pct') v = Math.round(obj * (1 + s/100) * 10) / 10;
    else v = g.direction === 'at_most' ? obj - s : obj + s;
    if(annual !== null){
      if(g.direction === 'at_most' && v < annual) v = annual;
      if(g.direction === 'at_least' && v > annual) v = annual;
    }
    return v === obj ? null : v;
  }
  function proposals(){
    var w1 = reviewWeek(), w0 = addDays(w1, -7), out = [];
    data.goals.forEach(function(g){
      if(g.role !== 'earning' || g.status !== 'active') return;
      var curRow = currentObjectiveRow(g); if(!curRow) return;
      var obj = Number(curRow.value);
      var sched = scheduledObjective(g);
      if(sched){ out.push({ g: g, obj: obj, scheduled: sched }); return; }
      var objWeek = weekStart(curRow.start_date);
      var weeks = [w0, w1].filter(function(w){ return w >= objWeek && addDays(w, 6) >= PROGRAM_START; });
      var met = weeks.length === 2 && weeks.every(function(w){ return metPeriod(g, weekTotal(g, w), obj) === true; });
      var next = met ? nextStep(g, obj) : null;
      out.push({ g: g, obj: obj, next: next, streak: [w0, w1].map(function(w){ return metPeriod(g, weekTotal(g, w), obj); }) });
    });
    return out;
  }

  function renderSunday(){
    var card = el('div','card'); card.id = 'sunday';
    var rw = reviewWeek();
    card.appendChild(el('h2', null, 'Sunday check-in' + (isSunday() ? ' · tonight' : '')));
    card.appendChild(el('p','empty-note', 'Reviewing the week of ' + short(rw) + ' – ' + short(addDays(rw, 6)) + '. An objective is ready to step up after 2 weeks in a row at or past it; nothing changes until you approve.'));

    // proposals
    var props = proposals();
    var ready = props.filter(function(p){ return p.next !== null && p.next !== undefined; });
    var h1 = el('div','eyebrow', 'Objective steps'); h1.style.marginTop = '6px'; card.appendChild(h1);
    if(!ready.length){
      card.appendChild(el('div','empty-note', 'No objective is ready to step up yet.'));
    }
    props.forEach(function(p){
      var g = p.g, sym = g.direction === 'at_most' ? '≤ ' : '';
      if(p.scheduled){
        card.appendChild(el('div','week-row', '<div class="name">' + esc(g.name) + '<span class="def">approved: ' + sym + fmt(Number(p.scheduled.value)) + ' ' + esc(g.unit) + ' from ' + short(p.scheduled.start_date) + '</span></div><div></div><div class="num">' + sym + fmt(p.obj) + ' → ' + sym + fmt(Number(p.scheduled.value)) + '</div><div class="tag met">set</div>'));
        return;
      }
      if(p.next === null || p.next === undefined) return;
      var row = el('div','week-row');
      row.style.gridTemplateColumns = '1fr auto';
      row.appendChild(el('div','name', esc(g.name) + '<span class="def">met 2 weeks running · step ' + sym + fmt(p.obj) + ' → ' + sym + fmt(p.next) + ' ' + esc(g.unit) + '/wk</span>'));
      var btns = el('div', null); btns.style.display = 'flex'; btns.style.gap = '6px';
      var ok = el('button','btn','Approve'); ok.disabled = busy;
      ok.onclick = function(){ approveStep(g, p.next); };
      var hold = el('button','btn','Hold'); hold.style.background = '#fff'; hold.style.color = 'var(--ink)';
      hold.onclick = function(){ flash = 'Holding ' + g.name + ' at ' + sym + fmt(p.obj) + ' this week.'; render(); location.hash = 'sunday'; };
      btns.appendChild(ok); btns.appendChild(hold); row.appendChild(btns);
      card.appendChild(row);
    });

    // payouts
    var h2 = el('div','eyebrow', 'Payouts to the Ally bucket'); h2.style.marginTop = '18px'; card.appendChild(h2);
    var paid = {}; data.payouts.forEach(function(p){ paid[p.week_start] = p; });
    var weeks = [], w = weekStart(PROGRAM_START);
    while(w <= rw){ weeks.push(w); w = addDays(w, 7); }
    var transferredTotal = data.payouts.filter(function(p){ return p.transferred; }).reduce(function(a, p){ return a + Number(p.dollars); }, 0);
    if(!weeks.length){ card.appendChild(el('div','empty-note', 'Your first payout appears on Sunday, ' + short(addDays(weekStart(PROGRAM_START), 6)) + '.')); }
    weeks.slice().reverse().forEach(function(ws){
      var e = weekEarnings(ws), p = paid[ws];
      var row = el('div','week-row');
      row.style.gridTemplateColumns = '1fr 80px auto';
      row.appendChild(el('div','name', 'Week of ' + short(ws) + '<span class="def">' + e.days + ' earning days</span>'));
      row.appendChild(el('div','earned', '$' + e.dollars));
      if(p && p.transferred){
        row.appendChild(el('div','tag met', 'transferred'));
      } else if(e.dollars > 0){
        var b = el('button','btn','Mark transferred'); b.disabled = busy;
        b.onclick = function(){ markTransferred(ws, e); };
        row.appendChild(b);
      } else {
        row.appendChild(el('div','tag notmet', 'nothing earned'));
      }
      card.appendChild(row);
    });
    var tot = el('div','stat-row'); tot.style.marginTop = '14px';
    tot.innerHTML = '<div class="stat"><div class="k">In the bucket (transferred)</div><div class="v met">$' + fmt(transferredTotal) + '</div></div>';
    card.appendChild(tot);
    if(flash){ var f = el('div','empty-note', esc(flash)); f.style.color = 'var(--met)'; card.appendChild(f); }
    return card;
  }

  async function approveStep(g, value){
    busy = true; render();
    var start = addDays(weekStart(today()), 7);
    var res = await sb.from('te_objectives').insert({ goal_id: g.id, value: value, start_date: start, note: 'approved at Sunday check-in' });
    flash = res.error ? ('Couldn’t save: ' + res.error.message) : (g.name + ' objective set to ' + fmt(value) + ' starting ' + short(start) + '.');
    await reload();
  }
  async function markTransferred(ws, e){
    busy = true; render();
    var res = await sb.from('te_payouts').upsert({ week_start: ws, earning_days: e.days, dollars: e.dollars, transferred: true, transferred_at: new Date().toISOString() }, { onConflict: 'week_start' });
    flash = res.error ? ('Couldn’t save: ' + res.error.message) : ('$' + e.dollars + ' for the week of ' + short(ws) + ' marked as transferred.');
    await reload();
  }
  async function reload(){
    try{ data = await load(); }catch(err){ flash = 'Reload failed: ' + err.message; }
    busy = false; render(); location.hash = 'sunday';
  }

  function renderWeek(){
    var w = thisWeek();
    var card = el('div','card'); card.id = 'week';
    card.appendChild(el('h2', null, 'This week · ' + short(w.ws) + ' – ' + short(w.we)));
    var stats = el('div','stat-row');
    stats.innerHTML =
      '<div class="stat"><div class="k">Earned this week</div><div class="v met">$' + w.dollars + '</div></div>' +
      '<div class="stat"><div class="k">Earned all time</div><div class="v">$' + allTimeDollars() + '</div></div>' +
      '<div class="stat"><div class="k">Days logged this week</div><div class="v">' + countDaysLogged(w) + ' / 7</div></div>';
    card.appendChild(stats);

    w.rows.filter(function(r){ return r.g.role === 'earning'; }).forEach(function(r){ card.appendChild(weekRow(r, true)); });
    var mon = w.rows.filter(function(r){ return r.g.role !== 'earning'; });
    if(mon.length){
      var h = el('div','eyebrow'); h.style.marginTop = '18px'; h.textContent = 'Monitored (no tokens)';
      card.appendChild(h);
      mon.forEach(function(r){ card.appendChild(weekRow(r, false)); });
    }
    return card;
  }
  function countDaysLogged(w){
    var s = {};
    data.entries.forEach(function(e){ if(e.entry_date >= w.ws && e.entry_date <= w.we && e.source === 'checkin') s[e.entry_date] = 1; });
    return Object.keys(s).length;
  }
  function weekRow(r, earning){
    var g = r.g, row = el('div','week-row');
    var target = r.obj !== null ? r.obj : (g.annual_target !== null ? Number(g.annual_target) : null);
    var sym = g.direction === 'at_most' ? '≤ ' : '';
    var windowWord = g.time_window === 'month' ? '/mo' : '/wk';
    row.appendChild(el('div','name', esc(g.name) + '<span class="def">' + (target !== null ? sym + fmt(target) + ' ' + esc(g.unit) + windowWord : esc(g.unit)) + (earning ? ' · $1 on days you ' + esc(g.daily_earn_rule) : '') + '</span>'));
    var bar = el('div','bar' + (g.direction === 'at_most' && r.total !== null && target !== null && r.total > target ? ' over' : ''));
    var pct = (r.total !== null && target) ? Math.min(100, (r.total / target) * 100) : 0;
    bar.innerHTML = '<span style="width:' + pct + '%"></span>';
    row.appendChild(bar);
    row.appendChild(el('div','num', fmt(r.total === null ? 0 : r.total) + (target !== null ? ' / ' + sym + fmt(target) : '')));
    row.appendChild(el('div','earned', earning ? '$' + r.days : ''));
    return row;
  }

  function renderGraphs(){
    var card = el('div','card'); card.id = 'graphs';
    card.appendChild(el('h2', null, 'Graphs'));
    var tabs = el('div','tabs');
    [['earning','Earning goals'],['monitor','Monitored']].forEach(function(t){
      var b = el('button', view === t[0] ? 'on' : '', t[1]);
      b.onclick = function(){ view = t[0]; render(); location.hash = 'graphs'; };
      tabs.appendChild(b);
    });
    card.appendChild(tabs);
    card.appendChild(el('div','legend',
      '<span><i style="border-color:#1E2A22"></i>weekly total</span>' +
      '<span><i style="border-color:#3F6B4A;border-top-style:dashed"></i>current objective (steps)</span>' +
      '<span><i style="border-color:#2F5A9E;border-top-style:dotted"></i>12-month goal</span>' +
      '<span>hollow point = week still in progress</span>'));

    data.goals.filter(function(g){ return g.status === 'active' && (view === 'earning' ? g.role === 'earning' : g.role !== 'earning'); })
      .forEach(function(g){
        var block = el('div','goal-block');
        var hd = el('div','goal-head');
        hd.appendChild(el('h3', null, esc(g.name)));
        var obj = objectiveOn(g.id, today());
        var sym = g.direction === 'at_most' ? '≤ ' : '';
        hd.appendChild(el('span','goal-def',
          (obj !== null ? 'objective ' + sym + fmt(obj) + ' · ' : '') +
          (g.annual_target !== null ? '12-mo goal ' + sym + fmt(Number(g.annual_target)) + ' ' + esc(g.unit) : esc(g.unit)) +
          (g.annual_target_note ? ' (' + esc(g.annual_target_note) + ')' : '')));
        block.appendChild(hd);
        var series = periodSeries(g);
        if(!series.length){ block.appendChild(el('div','empty-note','No data yet.')); }
        else { var wrap = el('div','graph-scroll'); wrap.appendChild(graph(g, series)); block.appendChild(wrap); }
        card.appendChild(block);
      });
    return card;
  }

  // single-case style graph: points per period, objective as a stepped dashed line,
  // vertical dashed phase lines where the objective changed, 12-month goal dotted.
  function graph(g, series){
    var ns = 'http://www.w3.org/2000/svg';
    var padL = 46, padR = 18, padT = 26, padB = 30, innerH = 140;
    var step = Math.max(34, Math.min(60, 640 / Math.max(series.length, 1)));
    var width = Math.max(300, padL + padR + step * Math.max(series.length - 1, 0) + 24);
    var height = padT + innerH + padB, yTop = padT, yBot = padT + innerH;
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.style.display = 'block'; svg.style.minWidth = width + 'px'; svg.style.width = '100%'; svg.style.height = 'auto';
    svg.setAttribute('font-family', "'IBM Plex Mono', monospace");
    function ln(x1,y1,x2,y2,c,dash,w){ var l = document.createElementNS(ns,'line'); l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2); l.setAttribute('stroke',c); l.setAttribute('stroke-width', w || 1); if(dash) l.setAttribute('stroke-dasharray',dash); svg.appendChild(l); }
    function tx(x,y,s,anchor,c,size,weight){ var t = document.createElementNS(ns,'text'); t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('font-size', size || 9.5); t.setAttribute('text-anchor', anchor || 'start'); t.setAttribute('fill', c || '#5B6B5F'); if(weight) t.setAttribute('font-weight', weight); t.textContent = s; svg.appendChild(t); }

    var objs = series.map(function(p){ return objectiveOn(g.id, g.time_window === 'month' ? p.key : addDays(p.key, 6)); });
    var vals = series.map(function(p){ return p.value; }).filter(function(v){ return v !== null; });
    var annual = g.annual_target !== null ? Number(g.annual_target) : null;
    var maxV = Math.max.apply(null, vals.concat(objs.filter(function(o){ return o !== null; })).concat(annual !== null ? [annual] : []).concat([1]));
    var minV = 0;
    if(g.aggregate === 'avg' || g.aggregate === 'last'){
      var lo = Math.min.apply(null, vals.concat(annual !== null ? [annual] : []));
      minV = Math.max(0, Math.floor(lo * 0.85));
    }
    var axisMax = niceCeil(maxV * 1.12);
    function y(v){ var c = Math.max(minV, Math.min(axisMax, v)); return yBot - ((c - minV) / (axisMax - minV || 1)) * innerH; }
    var xs = series.map(function(p, i){ return padL + 12 + i * step; });

    ln(padL, yBot, width - padR, yBot, 'rgba(30,42,34,0.35)');
    ln(padL, yTop, padL, yBot, 'rgba(30,42,34,0.35)');
    tx(padL - 6, yBot + 3, fmt(minV), 'end'); tx(padL - 6, yTop + 3, fmt(axisMax), 'end');

    if(annual !== null){ ln(padL, y(annual), width - padR, y(annual), 'rgba(47,90,158,0.75)', '2,3', 1.5); tx(width - padR, y(annual) - 4, '12-mo ' + fmt(annual), 'end', '#2F5A9E', 9, '600'); }

    // objective steps + phase-change lines
    for(var i = 0; i < series.length; i++){
      if(objs[i] === null) continue;
      var xa = xs[i] - step/2, xb = xs[i] + step/2;
      ln(Math.max(xa, padL), y(objs[i]), Math.min(xb, width - padR), y(objs[i]), 'rgba(63,107,74,0.85)', '4,3', 1.5);
      if(i > 0 && objs[i-1] !== null && objs[i-1] !== objs[i]){
        ln(xa, y(objs[i-1]), xa, y(objs[i]), 'rgba(63,107,74,0.85)', '4,3', 1.5);
        ln(xa, yTop - 8, xa, yBot, 'rgba(30,42,34,0.45)', '4,3');
      }
    }
    // data path (breaks across gaps)
    for(var k = 0; k < series.length - 1; k++){
      if(series[k].value !== null && series[k+1].value !== null) ln(xs[k], y(series[k].value), xs[k+1], y(series[k+1].value), 'rgba(30,42,34,0.7)', null, 1.4);
    }
    series.forEach(function(p, i){
      if(i % (series.length > 16 ? 4 : series.length > 8 ? 2 : 1) === 0 || i === series.length - 1) tx(xs[i], yBot + 17, short(p.key), 'middle', '#8B978E', 8.5);
      if(p.value === null) return;
      var met = metPeriod(g, p.value, objs[i]);
      var c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', xs[i]); c.setAttribute('cy', y(p.value)); c.setAttribute('r', 4.5);
      var col = met === null ? '#1E2A22' : (met ? '#3F6B4A' : '#B5502F');
      if(p.partial){ c.setAttribute('fill', '#fff'); c.setAttribute('stroke', col); c.setAttribute('stroke-width', 2); }
      else { c.setAttribute('fill', col); }
      svg.appendChild(c);
      tx(xs[i], y(p.value) - 9, fmt(p.value), 'middle', '#5B6B5F', 8.5);
    });
    return svg;
  }
  function niceCeil(v){
    if(v <= 5) return Math.ceil(v) || 1;
    var mag = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)), n = v / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  }

  // ---------- boot ----------
  (async function(){
    var s = await sb.auth.getSession();
    session = s.data.session;
    render();
    if(session){
      try{ data = await load(); }
      catch(e){ app.appendChild(el('div','status-msg','Couldn’t load data: ' + esc(e.message))); return; }
      render();
    }
  })();
})();
</script>
